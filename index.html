<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق الأسبوع - السوق السوري الحر</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Tajawal',sans-serif;background:#f8fafc}
.card{transition:all .25s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(0,0,0,.1)}
.line-clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="min-h-screen">

<script>
const SUPABASE_URL = 'https://vnxvbrlztlblbpfwydzgj.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_hqyuGb4LiX4hV2E7HI-ADQ_7RfbZjw9';
</script>

<header class="bg-white shadow-sm sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-11 h-11 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl flex items-center justify-center text-white font-black text-xl shadow">س</div>
<div><h1 class="font-black text-xl leading-none">سوق الأسبوع</h1><p class="text-[11px] text-gray-400">السوق السوري الحر - supabase حقيقي ✅</p></div>
</div>
<button onclick="openAdd()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-full font-bold shadow">+ أضف إعلان</button>
</div>
<div class="max-w-7xl mx-auto px-4 pb-4 flex gap-2 overflow-auto">
<input id="search" oninput="render()" placeholder="ابحث: آيفون، سيارة، شقة..." class="flex-1 min-w-[220px] border rounded-full px-5 py-3 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
<select id="catFilter" onchange="render()" class="border rounded-full px-4 py-3 text-sm bg-white"><option value="">كل الأقسام</option><option>جوالات</option><option>سيارات</option><option>عقارات</option><option>أثاث</option><option>إلكترونيات</option><option>ملابس</option><option>وظائف</option><option>أخرى</option></select>
<select id="locFilter" onchange="render()" class="border rounded-full px-4 py-3 text-sm bg-white"><option value="">كل المناطق</option><option>دمشق</option><option>حلب</option><option>حمص</option><option>اللاذقية</option><option>طرطوس</option><option>حماة</option><option>إدلب</option><option>دير الزور</option><option>السويداء</option><option>درعا</option></select>
</div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
<div id="status" class="hidden mb-4 p-4 rounded-2xl text-sm font-bold"></div>
<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
<div id="empty" class="hidden text-center py-24 text-gray-400">
<div class="text-7xl mb-4">🛍️</div>
<p class="font-bold">لا يوجد إعلانات حالياً</p>
<p class="text-sm mt-1">كن أول من ينشر!</p>
</div>
</main>

<div id="modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
<div class="bg-white rounded-[28px] w-full max-w-lg max-h-[92vh] overflow-auto p-7 shadow-2xl">
<div class="flex justify-between items-center mb-5"><h2 class="font-black text-xl">نشر إعلان جديد</h2><button onclick="closeAdd()" class="w-9 h-9 bg-gray-100 hover:bg-gray-200 rounded-full">✕</button></div>
<form onsubmit="submitAd(event)" class="space-y-4">
<input id="title" required placeholder="عنوان الإعلان *" class="w-full border border-gray-200 rounded-2xl px-4 py-3.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500">
<textarea id="desc" required placeholder="الوصف الكامل..." class="w-full border border-gray-200 rounded-2xl px-4 py-3.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500 h-24"></textarea>
<div class="grid grid-cols-2 gap-3">
<input id="price" type="number" required placeholder="السعر $" class="border border-gray-200 rounded-2xl px-4 py-3.5 text-sm outline-none focus:ring-2 focus:ring-emerald-500">
<select id="cat" class="border border-gray-200 rounded-2xl px-4 py-3.5 text-sm bg-white"><option>جوالات</option><option>سيارات</option><option>عقارات</option><option>أثاث</option><option>إلكترونيات</option><option>ملابس</option><option>وظائف</option><option>أخرى</option></select>
</div>
<div class="grid grid-cols-2 gap-3">
<select id="loc" class="border border-gray-200 rounded-2xl px-4 py-3.5 text-sm bg-white"><option>دمشق</option><option>حلب</option><option>حمص</option><option>اللاذقية</option><option>طرطوس</option><option>حماة</option><option>إدلب</option><option>دير الزور</option><option>السويداء</option><option>درعا</option></select>
<select id="cond" class="border border-gray-200 rounded-2xl px-4 py-3.5 text-sm bg-white"><option>جديد</option><option>مستعمل - ممتاز</option><option>مستعمل - جيد</option></select>
</div>
<input id="name" required placeholder="اسمك *" class="w-full border border-gray-200 rounded-2xl px-4 py-3.5 text-sm">
<input id="phone" required placeholder="رقم الواتساب (9639...)*" class="w-full border border-gray-200 rounded-2xl px-4 py-3.5 text-sm">
<div>
<label class="text-xs font-bold text-gray-600 mb-2 block">الصور (حتى 4)</label>
<input id="images" type="file" accept="image/*" multiple class="w-full border border-dashed border-gray-300 rounded-2xl px-4 py-3 text-sm bg-gray-50">
<div id="preview" class="flex gap-2 flex-wrap mt-3"></div>
</div>
<button id="submitBtn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white py-4 rounded-2xl font-black text-[15px] shadow-lg">نشر الآن في قاعدة حقيقية ✅</button>
<p class="text-[11px] text-center text-gray-400">الإعلان يحفظ في Supabase ويظهر للجميع فوراً وللأبد</p>
</form>
</div>
</div>

<script>
let sb=null, all=[], tempImages=[];

function showStatus(msg,cls){
  const s=document.getElementById('status');
  s.textContent=msg; s.className='mb-4 p-4 rounded-2xl text-sm font-bold '+cls; s.classList.remove('hidden');
}

function init(){
 try{
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return true;
 }catch(e){ showStatus('خطأ اتصال: '+e.message,'bg-red-100 text-red-700'); return false; }
}

async function load(){
 if(!sb && !init()) return;
 document.getElementById('grid').innerHTML='<div class="col-span-full text-center py-16"><div class="animate-spin w-8 h-8 border-4 border-emerald-600 border-t-transparent rounded-full mx-auto mb-3"></div><p class="text-gray-400">جاري التحميل من قاعدة البيانات الحقيقية...</p></div>';
 const {data,error} = await sb.from('listings').select('*').order('created_at',{ascending:false});
 if(error){
   if(error.message.includes('does not exist')) showStatus('⚠️ شغّل كود SQL أولاً في Supabase > SQL Editor > New Query','bg-amber-100 text-amber-800 border border-amber-200');
   else showStatus('خطأ: '+error.message,'bg-red-100 text-red-700');
   document.getElementById('grid').innerHTML='';
   return;
 }
 all=data||[];
 render();
 showStatus(`✅ تم تحميل ${all.length} إعلان من Supabase - قاعدة حقيقية تعمل!`,'bg-emerald-50 text-emerald-700 border border-emerald-200');
 setTimeout(()=>document.getElementById('status').classList.add('hidden'),5000);
}

function render(){
 const q=document.getElementById('search').value.toLowerCase();
 const cf=document.getElementById('catFilter').value;
 const lf=document.getElementById('locFilter').value;
 const f=all.filter(l=>{
  const matchQ = !q || l.title.toLowerCase().includes(q) || (l.description||'').toLowerCase().includes(q);
  const matchC = !cf || l.category===cf;
  const matchL = !lf || l.location===lf;
  return matchQ && matchC && matchL;
 });
 const grid=document.getElementById('grid');
 const empty=document.getElementById('empty');
 if(!f.length){ grid.innerHTML=''; empty.classList.remove('hidden'); return; }
 empty.classList.add('hidden');
 grid.innerHTML=f.map(l=>`
  <div class="card bg-white rounded-[22px] overflow-hidden border border-gray-100">
   <div class="h-52 bg-gray-100 relative overflow-hidden">
    ${l.images && l.images[0] ? `<img src="${l.images[0]}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-5xl bg-gradient-to-br from-gray-100 to-gray-200">📦</div>`}
    <span class="absolute top-3 right-3 bg-white/95 backdrop-blur px-3 py-1.5 rounded-full text-xs font-bold shadow">${l.category||''}</span>
    <span class="absolute top-3 left-3 bg-emerald-600 text-white px-3 py-1.5 rounded-full text-xs font-black shadow">${l.price||0}$</span>
   </div>
   <div class="p-4">
    <h3 class="font-bold text-[15px] line-clamp-1 leading-snug">${l.title}</h3>
    <p class="text-[13px] text-gray-500 line-clamp-2 mt-1.5 leading-relaxed">${l.description||''}</p>
    <div class="flex justify-between items-center mt-3 text-[11px] text-gray-400">
     <span>📍 ${l.location||''} • ${l.condition||''}</span>
     <span>${new Date(l.created_at).toLocaleDateString('ar-SY')}</span>
    </div>
    <div class="mt-3.5 flex gap-2">
     <a href="https://wa.me/${(l.phone||'').replace(/[^0-9]/g,'')}" target="_blank" class="flex-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 text-center py-2.5 rounded-full font-bold text-xs transition">💬 واتساب</a>
     <button onclick="alert('👤 ${l.name}\n📞 ${l.phone}')" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2.5 rounded-full font-bold text-xs transition">📞 اتصال</button>
    </div>
   </div>
  </div>
 `).join('');
}

function openAdd(){ document.getElementById('modal').classList.remove('hidden'); }
function closeAdd(){ document.getElementById('modal').classList.add('hidden'); }

document.getElementById('images').addEventListener('change',e=>{
 tempImages=[]; const p=document.getElementById('preview'); p.innerHTML='';
 [...e.target.files].slice(0,4).forEach(f=>{
  const r=new FileReader();
  r.onload=ev=>{ tempImages.push(ev.target.result); p.innerHTML+=`<img src="${ev.target.result}" class="w-16 h-16 rounded-2xl object-cover border">`; };
  r.readAsDataURL(f);
 });
});

async function submitAd(ev){
 ev.preventDefault();
 const btn=document.getElementById('submitBtn');
 btn.disabled=true; btn.textContent='جاري النشر في Supabase...';
 const data={
  title: document.getElementById('title').value,
  description: document.getElementById('desc').value,
  price: parseInt(document.getElementById('price').value)||0,
  category: document.getElementById('cat').value,
  location: document.getElementById('loc').value,
  condition: document.getElementById('cond').value,
  name: document.getElementById('name').value,
  phone: document.getElementById('phone').value,
  images: tempImages,
  status:'active'
 };
 const {error} = await sb.from('listings').insert([data]);
 btn.disabled=false; btn.textContent='نشر الآن في قاعدة حقيقية ✅';
 if(error){ alert('خطأ: '+error.message); return; }
 closeAdd(); ev.target.reset(); tempImages=[]; document.getElementById('preview').innerHTML='';
 showStatus('🎉 تم نشر الإعلان بنجاح - محفوظ في قاعدة حقيقية ولن يضيع!','bg-emerald-100 text-emerald-800 border border-emerald-200');
 load();
}

init();
load();
</script>
</body>
</html>
