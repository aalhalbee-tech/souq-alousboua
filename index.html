<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{font-family:'Tajawal',sans-serif}
body{background:#f5f7fb}
.card{transition:.2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.1)}
@keyframes marquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.marquee{animation:marquee 30s linear infinite}
.scrollbar-hide::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<script>
const SUPABASE_URL='https://vnxvbrlztdlbpfwydzgj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_hqyuGb4LiX4hV2E7HI-ADQ_7RfbZjw9';
</script>
<header class="bg-white sticky top-0 z-40 border-b">
<div class="max-w- mx-auto px-4 py-3 flex items-center justify-between gap-3">
<div class="flex items-center gap-3">
<div class="w-10 h-10 bg-zinc-900 rounded-xl flex items-center justify-center text-white font-black">س</div>
<div class="leading-tight"><div class="font-black text-">سوق الأسبوع</div><div class="text- text-gray-500">بيع واشتري بأمان</div></div>
</div>
<div class="flex-1 max-w-xl mx-4 hidden md:flex">
<div class="relative w-full">
<input id="search" oninput="render()" placeholder="دور على أي شي..." class="w-full bg-gray-100 border border-gray-100 rounded-full px-5 py-2.5 pr-11 text-sm outline-none focus:bg-white focus:border-zinc-900">
<span class="absolute right-4 top-1/2 -translate-y-1/2">🔍</span>
</div>
</div>
<div class="flex items-center gap-2">
<button id="loginBtn" onclick="openLogin()" class="w-9 h-9 md:w-auto md:px-4 md:py-2 bg-gray-100 rounded-full flex items-center justify-center gap-1 font-bold text-sm">👤<span class="hidden md:block">دخول</span></button>
<div id="userBox" class="hidden items-center gap-2"><span id="userName" class="text-sm font-bold bg-gray-100 px-3 py-1.5 rounded-full"></span><button onclick="logout()" class="text-xs">✕</button></div>
<button onclick="openAdd()" class="bg-zinc-900 text-white px-5 py-2.5 rounded-full font-black text-sm">+ نشر إعلان</button>
</div>
</div>
<div class="md:hidden px-4 pb-3"><input id="searchM" oninput="document.getElementById('search').value=this.value;render()" placeholder="دور على أي شي..." class="w-full bg-gray-100 rounded-full px-5 py-2.5 text-sm"></div>
</header>
<div class="bg-zinc-900 text-white text- py-2 overflow-hidden relative">
<div class="flex gap-8 whitespace-nowrap marquee w-max">
<span>🔥 أحمد من حلب اشترى بطارية بضمان</span><span>☀️ عرض جديد طاقة شمسية في دمشق</span><span>✅ تم توثيق 3 هويات اليوم</span><span>🔥 أحمد من حلب اشترى بطارية بضمان</span>
</div>
<span class="absolute right-2 top-1/2 -translate-y-1/2 bg-amber-400 text-zinc-900 px-2.5 py-0.5 rounded-full text- font-black">مباشر</span>
</div>
<div class="bg-white border-b">
<div class="max-w- mx-auto px-4 py-3 space-y-3">
<div class="flex gap-2 overflow-auto scrollbar-hide">
<button onclick="setCity('')" id="city-ALL" class="cityBtn bg-zinc-900 text-white px-4 py-2 rounded-full text-sm font-bold">الكل</button>
<button onclick="setCity('دمشق')" class="cityBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">دمشق</button>
<button onclick="setCity('حلب')" class="cityBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">حلب</button>
<button onclick="setCity('منبج')" class="cityBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">منبج</button>
<button onclick="setCity('حمص')" class="cityBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">حمص</button>
<button onclick="setCity('اللاذقية')" class="cityBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">اللاذقية</button>
</div>
<div class="flex gap-2 overflow-auto scrollbar-hide">
<button onclick="setCat('')" id="cat-ALL" class="catBtn bg-amber-300 px-4 py-2 rounded-full text-sm font-bold">الكل</button>
<button onclick="setCat('موثق')" class="catBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">موثق ✅</button>
<button onclick="setCat('طاقة')" class="catBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">طاقة ☀️</button>
<button onclick="setCat('بدل')" class="catBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">بدل 🔄</button>
<button onclick="setCat('وظائف')" class="catBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">وظائف 💼</button>
<button onclick="setCat('شام كاش')" class="catBtn bg-white border px-4 py-2 rounded-full text-sm font-bold">💳 شام كاش</button>
</div>
</div>
</div>
<main class="max-w- mx-auto px-4 py-5">
<div class="flex justify-between mb-4"><button onclick="clearFilters()" class="bg-white border px-3 py-1.5 rounded-full text-xs">مسح الفلتر</button><span id="count" class="text-xs font-bold text-gray-500"></span></div>
<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>
<div id="empty" class="hidden text-center py-20 text-gray-400">لا يوجد إعلانات</div>
</main>
<div id="loginModal" class="hidden fixed inset-0 bg-black/60 z-[80] flex items-center justify-center p-4"><div class="bg-white rounded- w-full max-w-sm p-6"><h2 class="font-black text-xl mb-4">تسجيل دخول</h2><input id="loginPhone" placeholder="9639..." class="w-full border rounded-2xl px-4 py-3 mb-3 text-sm"><input id="loginName" placeholder="اسمك" class="w-full border rounded-2xl px-4 py-3 mb-3 text-sm"><button onclick="doLogin()" class="w-full bg-zinc-900 text-white py-3 rounded-2xl font-black">دخول</button><button onclick="closeLogin()" class="w-full mt-2 bg-gray-100 py-3 rounded-2xl">إغلاق</button></div></div>
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4"><div class="bg-white rounded- w-full max-w-lg max-h- overflow-auto p-6"><div class="flex justify-between mb-4"><h2 class="font-black text-xl">نشر إعلان</h2><button onclick="closeAdd()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div><form onsubmit="submitAd(event)" class="space-y-3"><input id="title" required placeholder="عنوان *" class="w-full border rounded-2xl px-4 py-3 text-sm"><textarea id="desc" required placeholder="الوصف..." class="w-full border rounded-2xl px-4 py-3 text-sm h-20"></textarea><div class="grid grid-cols-2 gap-2"><input id="price" type="number" required placeholder="السعر $" class="border rounded-2xl px-4 py-3 text-sm"><select id="cat" class="border rounded-2xl px-4 py-3 text-sm bg-white"><option>جوالات</option><option>سيارات</option><option>عقارات</option><option>طاقة</option><option>وظائف</option><option>أخرى</option></select></div><div class="grid grid-cols-2 gap-2"><select id="loc" class="border rounded-2xl px-4 py-3 text-sm bg-white"><option>دمشق</option><option>حلب</option><option>منبج</option><option>حمص</option></select><select id="cond" class="border rounded-2xl px-4 py-3 text-sm bg-white"><option>جديد</option><option>مستعمل</option></select></div><input id="name" required placeholder="اسمك *" class="w-full border rounded-2xl px-4 py-3 text-sm"><input id="phone" required placeholder="واتساب 9639..." class="w-full border rounded-2xl px-4 py-3 text-sm"><div class="bg-amber-50 border border-amber-200 rounded-2xl p-4"><label class="flex gap-2 font-bold text-sm"><input type="checkbox" id="shamEnabled" onchange="document.getElementById('shamBox').classList.toggle('hidden',!this.checked)"> 💳 أقبل شام كاش</label><div id="shamBox" class="hidden mt-3"><input id="shamWallet" placeholder="رقم محفظة شام كاش" class="w-full border rounded-xl px-4 py-3 text-sm bg-white"></div></div><input id="images" type="file" accept="image/*" multiple class="w-full border-dashed border rounded-2xl px-4 py-3 text-sm bg-gray-50"><div id="preview" class="flex gap-2 flex-wrap"></div><button id="submitBtn" class="w-full bg-zinc-900 text-white py-4 rounded-2xl font-black">نشر الآن ✅</button></form></div></div>
<div id="detailModal" class="hidden fixed inset-0 bg-black/70 z-[90] flex items-center justify-center p-4"><div class="bg-white rounded- w-full max-w-md overflow-hidden"><div id="detailImgWrap" class="h-56 bg-gray-100"></div><div class="p-5"><h3 id="detailTitle" class="font-black text-lg"></h3><p id="detailDesc" class="text-sm text-gray-600 mt-2"></p><div id="detailSham" class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-4 mt-4"><p class="font-black text-sm">💳 شام كاش</p><p class="text-xs mt-1">محفظة: <span id="detailWallet" class="font-mono font-bold"></span></p><button onclick="alert('تم!')" class="w-full mt-3 bg-amber-400 py-2.5 rounded-xl font-black text-sm">تم التحويل ✅</button></div><div class="grid grid-cols-2 gap-2 mt-4"><a id="detailWA" target="_blank" class="bg-emerald-600 text-white text-center py-3 rounded-xl font-bold text-sm">💬 واتساب</a><button onclick="document.getElementById('detailModal').classList.add('hidden')" class="bg-gray-100 py-3 rounded-xl font-bold text-sm">إغلاق</button></div></div></div></div>
<script>
let sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY),all=[],tempImages=[],city='',category='',currentUser=null;
const saved=localStorage.getItem('souq_user');
if(saved){currentUser=JSON.parse(saved);document.getElementById('loginBtn').classList.add('hidden');document.getElementById('userBox').classList.remove('hidden');document.getElementById('userBox').classList.add('flex');document.getElementById('userName').textContent=currentUser.name;}
function openLogin(){document.getElementById('loginModal').classList.remove('hidden');}
function closeLogin(){document.getElementById('loginModal').classList.add('hidden');}
function doLogin(){const p=document.getElementById('loginPhone').value.trim(),n=document.getElementById('loginName').value.trim()||p;if(!p){alert('رقم');return;}localStorage.setItem('souq_user',JSON.stringify({phone:p,name:n}));location.reload();}
function logout(){localStorage.removeItem('souq_user');location.reload();}
function openAdd(){if(!currentUser){openLogin();return;}const u=JSON.parse(localStorage.getItem('souq_user'));document.getElementById('name').value=u.name||'';document.getElementById('phone').value=u.phone||'';document.getElementById('modal').classList.remove('hidden');}
function closeAdd(){document.getElementById('modal').classList.add('hidden');}
function setCity(c){city=c;render();}
function setCat(c){category=c;render();}
function clearFilters(){city='';category='';document.getElementById('search').value='';render();}
async function load(){const {data}=await sb.from('listings').select('*').order('created_at',{ascending:false});all=data||[];render();}
function getEmoji(cat){if(cat==='سيارات')return'🚗';if(cat==='طاقة')return'☀️';if(cat==='جوالات')return'📱';if(cat==='عقارات')return'🏠';if(cat==='وظائف')return'👨‍🍳';return'📦';}
function getBg(cat){if(cat==='سيارات')return'bg-green-200';if(cat==='طاقة')return'bg-blue-200';if(cat==='جوالات')return'bg-amber-100';if(cat==='وظائف')return'bg-pink-200';return'bg-gray-100';}
function render(){
const q=(document.getElementById('search').value||'').toLowerCase();
const f=all.filter(l=>{const mQ=!q||l.title.toLowerCase().includes(q);const mCity=!city||l.location===city;let mCat=true;if(category==='شام كاش')mCat=l.sham_enabled||l.sham_wallet;else if(category)mCat=l.category===category;return mQ&&mCity&&mCat;});
document.getElementById('count').textContent=f.length+' إعلان';
const grid=document.getElementById('grid');
if(!f.length){grid.innerHTML='';document.getElementById('empty').classList.remove('hidden');return;}
document.getElementById('empty').classList.add('hidden');
grid.innerHTML=f.map(l=>{const emoji=getEmoji(l.category);const bg=getBg(l.category);const views=Math.floor(Math.random()*400)+50;const isSham=l.sham_enabled||l.sham_wallet;return`<div onclick="openDetail('${l.id}')" class="card bg-white rounded- overflow-hidden border cursor-pointer"><div class="h- ${bg} relative flex items-center justify-center">${l.images&&l.images[0]?`<img src="${l.images[0]}" class="absolute inset-0 w-full h-full object-cover">`:''}<div class="text- relative z-10">${emoji}</div><div class="absolute top-3 right-3 bg-white px-2.5 py-1 rounded-full text- font-bold">موثق ✅</div><div class="absolute bottom-3 left-3 bg-zinc-900 text-white px-2.5 py-1 rounded-full text- font-bold">👁️ ${views}</div>${isSham?'<div class="absolute bottom-3 right-3 bg-zinc-900 text-white px-2.5 py-1 rounded-full text- font-black">بضمان</div>':''}</div><div class="p-3.5"><h3 class="font-bold text-">${l.title}</h3><div class="text- text-gray-500 mt-1">📍 ${l.location||''}</div><div class="flex justify-between items-end mt-3"><span class="text- text-gray-400">${new Date(l.created_at).toLocaleDateString('ar-SY')}</span><span class="font-black text-">${l.price}$</span></div></div></div>`;}).join('');
}
function openDetail(id){const l=all.find(x=>x.id===id);if(!l)return;document.getElementById('detailTitle').textContent=l.title;document.getElementById('detailDesc').textContent=l.description||'';document.getElementById('detailImgWrap').innerHTML=l.images&&l.images[0]?`<img src="${l.images[0]}" class="w-full h-full object-cover">`:`<div class="w-full h-full flex items-center justify-center text-6xl ${getBg(l.category)}">${getEmoji(l.category)}</div>`;const sham=document.getElementById('detailSham');if(l.sham_enabled||l.sham_wallet){sham.classList.remove('hidden');document.getElementById('detailWallet').textContent=l.sham_wallet||l.phone;}else sham.classList.add('hidden');document.getElementById('detailWA').href=`https://wa.me/${(l.phone||'').replace(/[^0-9]/g,'')}`;document.getElementById('detailModal').classList.remove('hidden');}
document.getElementById('images').addEventListener('change',e=>{tempImages=[];const p=document.getElementById('preview');p.innerHTML='';[...e.target.files].slice(0,4).forEach(f=>{const r=new FileReader();r.onload=ev=>{tempImages.push(ev.target.result);p.innerHTML+=`<img src="${ev.target.result}" class="w-16 h-16 rounded-xl object-cover border">`;};r.readAsDataURL(f);});});
async function submitAd(ev){ev.preventDefault();const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='جاري...';const data={title:document.getElementById('title').value,description:document.getElementById('desc').value,price:parseInt(document.getElementById('price').value)||0,category:document.getElementById('cat').value,location:document.getElementById('loc').value,condition:document.getElementById('cond').value,name:document.getElementById('name').value,phone:document.getElementById('phone').value,images:tempImages,sham_enabled:document.getElementById('shamEnabled').checked,sham_wallet:document.getElementById('shamWallet').value,status:'active'};const {error}=await sb.from('listings').insert([data]);btn.disabled=false;btn.textContent='نشر الآن ✅';if(error){alert(error.message);return;}document.getElementById('modal').classList.add('hidden');ev.target.reset();load();}
load();
</script>
</body>
</html>
