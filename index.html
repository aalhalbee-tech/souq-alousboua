<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق الأسبوع - بيع واشتري بأمان</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif;background:#f8fafc}.card{transition:.25s}.card:hover{transform:translateY(-4px);box-shadow:0 16px 30px rgba(0,0,0,.1)}</style>
</head>
<body>
<script>
const SUPABASE_URL='https://vnxvbrlztdlbpfwydzgj.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_hqyuGb4LiX4hV2E7HI-ADQ_7RfbZjw9';
</script>

<header class="bg-white shadow-sm sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-11 h-11 bg-gradient-to-br from-emerald-500 to-teal-600 rounded-2xl flex items-center justify-center text-white font-black text-xl">س</div>
<div><h1 class="font-black text-xl">سوق الأسبوع</h1><p class="text- text-gray-400">بيع واشتري بأمان • شام كاش 💳</p></div>
</div>
<div class="flex gap-2 items-center">
<button id="loginBtn" onclick="document.getElementById('loginModal').classList.remove('hidden')" class="border px-4 py-2 rounded-full font-bold text-sm">👤 دخول</button>
<div id="userBox" class="hidden gap-2 items-center"><span id="userName" class="text-sm font-bold"></span><button onclick="localStorage.removeItem('souq_user');location.reload()" class="text-xs bg-gray-100 px-3 py-1 rounded-full">خروج</button></div>
<button onclick="document.getElementById('modal').classList.remove('hidden')" class="bg-emerald-600 text-white px-5 py-2.5 rounded-full font-bold text-sm">+ نشر إعلان</button>
</div>
</div>
<div class="max-w-7xl mx-auto px-4 pb-3 flex gap-2 overflow-auto">
<input id="search" oninput="render()" placeholder="ابحث..." class="flex-1 min-w- border rounded-full px-5 py-3 text-sm outline-none">
<select id="catFilter" onchange="render()" class="border rounded-full px-4 py-3 text-sm bg-white"><option value="">كل الأقسام</option><option>جوالات</option><option>سيارات</option><option>عقارات</option><option>أثاث</option><option>إلكترونيات</option></select>
<select id="locFilter" onchange="render()" class="border rounded-full px-4 py-3 text-sm bg-white"><option value="">كل المناطق</option><option>دمشق</option><option>حلب</option><option>منبج</option><option>حمص</option><option>حماة</option><option>اللاذقية</option></select>
<select id="payFilter" onchange="render()" class="border rounded-full px-4 py-3 text-sm bg-white"><option value="">كل الدفع</option><option value="sham">💳 شام كاش</option></select>
</div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
<div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5"></div>
</main>

<!-- دخول -->
<div id="loginModal" class="hidden fixed inset-0 bg-black/60 z-[70] flex items-center justify-center p-4">
<div class="bg-white rounded- w-full max-w-sm p-7">
<h2 class="font-black text-xl mb-4">تسجيل دخول</h2>
<input id="loginPhone" placeholder="رقم 9639..." class="w-full border rounded-2xl px-4 py-3 mb-3">
<input id="loginName" placeholder="اسمك" class="w-full border rounded-2xl px-4 py-3 mb-3">
<button onclick="const p=document.getElementById('loginPhone').value;const n=document.getElementById('loginName').value||p;if(!p)return alert('رقم');localStorage.setItem('souq_user',JSON.stringify({phone:p,name:n}));location.reload()" class="w-full bg-zinc-900 text-white py-3 rounded-2xl font-black">دخول</button>
<button onclick="document.getElementById('loginModal').classList.add('hidden')" class="w-full mt-2 bg-gray-100 py-3 rounded-2xl">إغلاق</button>
</div>
</div>

<!-- نشر -->
<div id="modal" class="hidden fixed inset-0 bg-black/60 z-[60] flex items-center justify-center p-4">
<div class="bg-white rounded- w-full max-w-lg max-h- overflow-auto p-7">
<div class="flex justify-between mb-4"><h2 class="font-black text-xl">نشر إعلان</h2><button onclick="document.getElementById('modal').classList.add('hidden')" class="w-9 h-9 bg-gray-100 rounded-full">✕</button></div>
<form onsubmit="submitAd(event)" class="space-y-3">
<input id="title" required placeholder="عنوان *" class="w-full border rounded-2xl px-4 py-3 text-sm">
<textarea id="desc" required placeholder="وصف..." class="w-full border rounded-2xl px-4 py-3 text-sm h-20"></textarea>
<div class="grid grid-cols-2 gap-2"><input id="price" type="number" required placeholder="سعر $" class="border rounded-2xl px-4 py-3 text-sm"><select id="cat" class="border rounded-2xl px-4 py-3 text-sm bg-white"><option>جوالات</option><option>سيارات</option><option>عقارات</option></select></div>
<div class="grid grid-cols-2 gap-2"><select id="loc" class="border rounded-2xl px-4 py-3 text-sm bg-white"><option>دمشق</option><option>حلب</option><option>منبج</option><option>حمص</option></select><input id="name" required placeholder="اسمك" class="border rounded-2xl px-4 py-3 text-sm"></div>
<input id="phone" required placeholder="واتساب 9639..." class="w-full border rounded-2xl px-4 py-3 text-sm">
<!-- شام كاش -->
<div class="bg-amber-50 border border-amber-200 rounded-2xl p-4">
<label class="flex gap-2 font-bold text-sm"><input type="checkbox" id="shamEnabled" onchange="document.getElementById('shamBox').classList.toggle('hidden',!this.checked)"> 💳 أقبل شام كاش</label>
<div id="shamBox" class="hidden mt-2"><input id="shamWallet" placeholder="رقم محفظة شام كاش" class="w-full border rounded-xl px-4 py-3 text-sm bg-white"><p class="text- text-amber-700 mt-1">أكثر من 4 مليون مستخدم في سوريا، تحويل آمن عبر وكلاء معتمدين【422492465781771594†L20-L23】</p></div>
</div>
<input id="images" type="file" accept="image/*" multiple class="w-full border-dashed border rounded-2xl px-4 py-3 text-sm bg-gray-50">
<div id="preview" class="flex gap-2 flex-wrap"></div>
<button id="submitBtn" class="w-full bg-emerald-600 text-white py-4 rounded-2xl font-black">نشر الآن ✅</button>
</form>
</div>
</div>

<script>
let sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY), all=[], tempImages=[];
const saved=localStorage.getItem('souq_user');
if(saved){ const u=JSON.parse(saved); document.getElementById('loginBtn').classList.add('hidden'); document.getElementById('userBox').classList.remove('hidden'); document.getElementById('userBox').classList.add('flex'); document.getElementById('userName').textContent='مرحبا '+u.name; }
async function load(){ const {data}=await sb.from('listings').select('*').order('created_at',{ascending:false}); all=data||[]; render(); }
function render(){
 const q=document.getElementById('search').value.toLowerCase(), cf=document.getElementById('catFilter').value, lf=document.getElementById('locFilter').value, pf=document.getElementById('payFilter').value;
 const f=all.filter(l=>{ const mQ=!q||l.title.toLowerCase().includes(q); const mC=!cf||l.category===cf; const mL=!lf||l.location===lf; const mP=!pf||(pf==='sham'&&(l.sham_enabled||l.sham_wallet)); return mQ&&mC&&mL&&mP; });
 document.getElementById('grid').innerHTML=f.map(l=>`
 <div class="bg-white rounded- border overflow-hidden">
 <div class="h-48 bg-gray-100 relative"><img src="${l.images?.[0]||''}" class="w-full h-full object-cover" onerror="this.style.display='none'"><div class="absolute inset-0 flex items-center justify-center text-4xl">${l.images?.[0]?'':'📦'}</div><span class="absolute top-3 right-3 bg-white px-3 py-1 rounded-full text-xs font-bold">${l.category}</span><span class="absolute top-3 left-3 bg-emerald-600 text-white px-3 py-1 rounded-full text-xs font-black">${l.price}$</span>${(l.sham_enabled||l.sham_wallet)?'<span class="absolute bottom-3 right-3 bg-amber-400 px-2 py-1 rounded-full text- font-black">💳 شام كاش</span>':''}</div>
 <div class="p-4"><h3 class="font-bold text-">${l.title}</h3><p class="text-xs text-gray-500 mt-1">📍 ${l.location}</p><div class="flex gap-2 mt-3"><a href="https://wa.me/${(l.phone||'').replace(/[^0-9]/g,'')}" target="_blank" class="flex-1 bg-emerald-50 text-emerald-700 text-center py-2 rounded-full font-bold text-xs">واتساب</a><button onclick="alert('محفظة شام كاش: '+(l.sham_wallet||l.phone)+' - افتح تطبيق شام كاش وحول المبلغ')" class="flex-1 bg-amber-100 py-2 rounded-full font-bold text-xs">${(l.sham_enabled||l.sham_wallet)?'💳 شام كاش':'📞 اتصال'}</button></div></div></div>`).join('');
}
document.getElementById('images').addEventListener('change',e=>{ tempImages=[]; const p=document.getElementById('preview'); p.innerHTML=''; [...e.target.files].slice(0,4).forEach(f=>{ const r=new FileReader(); r.onload=ev=>{ tempImages.push(ev.target.result); p.innerHTML+=`<img src="${ev.target.result}" class="w-16 h-16 rounded-xl object-cover">`; }; r.readAsDataURL(f); }); });
async function submitAd(ev){ ev.preventDefault(); const btn=document.getElementById('submitBtn'); btn.disabled=true; btn.textContent='جاري...'; const data={title:title.value,description:desc.value,price:parseInt(price.value)||0,category:cat.value,location:loc.value,name:name.value,phone:phone.value,images:tempImages,sham_enabled:document.getElementById('shamEnabled').checked,sham_wallet:document.getElementById('shamWallet').value,status:'active'}; const {error}=await sb.from('listings').insert([data]); btn.disabled=false; btn.textContent='نشر الآن ✅'; if(error)return alert(error.message); document.getElementById('modal').classList.add('hidden'); ev.target.reset(); load(); }
load();
</script>
</body>
</html>
