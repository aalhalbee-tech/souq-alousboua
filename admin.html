<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة التحكم - سوق الأسبوع</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Tajawal',sans-serif;background:#f8fafc}</style>
</head>
<body>
<header class="bg-white shadow-sm p-4 flex justify-between items-center"><h1 class="font-black">🎛️ لوحة تحكم - Supabase حقيقي ✅</h1><div class="flex gap-2"><a href="index.html" class="bg-gray-100 px-4 py-2 rounded-full text-sm font-bold">السوق</a><button onclick="load()" class="bg-emerald-600 text-white px-4 py-2 rounded-full text-sm">تحديث</button></div></header>
<main class="max-w-5xl mx-auto p-4"><div id="stats" class="grid grid-cols-3 gap-3 mb-4"></div><div class="bg-white rounded-2xl p-4 shadow border"><div id="list" class="space-y-3"></div></div></main>
<script>
const sb = window.supabase.createClient('https://vnxvbrlztlblbpfwydzgj.supabase.co', 'sb_publishable_hqyuGb4LiX4hV2E7HI-ADQ_7RfbZjw9');
async function load(){
 const {data,error} = await sb.from('listings').select('*').order('created_at',{ascending:false});
 if(error){ document.getElementById('list').innerHTML='<p class="text-red-600">'+error.message+'</p>'; return; }
 document.getElementById('stats').innerHTML=`<div class="bg-white p-4 rounded-2xl border text-center"><div class="text-2xl font-black">${data.length}</div><div class="text-xs text-gray-400">إجمالي الإعلانات</div></div><div class="bg-white p-4 rounded-2xl border text-center"><div class="text-2xl font-black">${new Set(data.map(d=>d.category)).size}</div><div class="text-xs text-gray-400">الأقسام</div></div><div class="bg-white p-4 rounded-2xl border text-center"><div class="text-2xl font-black">${new Set(data.map(d=>d.location)).size}</div><div class="text-xs text-gray-400">المناطق</div></div>`;
 document.getElementById('list').innerHTML = data.map(l=>`<div class="flex gap-3 border border-gray-100 p-3 rounded-2xl hover:bg-gray-50"><img src="${l.images&&l.images[0]?l.images[0]:'https://via.placeholder.com/80'}" class="w-20 h-20 rounded-xl object-cover"><div class="flex-1"><h3 class="font-bold text-sm">${l.title} - ${l.price}$</h3><p class="text-xs text-gray-500">${l.category} • ${l.location} • ${l.name} • ${l.phone}</p><p class="text-[11px] text-gray-400 mt-1">${new Date(l.created_at).toLocaleString('ar-SY')}</p></div><button onclick="del('${l.id}')" class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-full text-xs font-bold h-fit">حذف</button></div>`).join('') || '<p class="text-center text-gray-400 py-10">لا يوجد إعلانات بعد</p>';
}
async function del(id){ if(!confirm('حذف نهائي؟'))return; await sb.from('listings').delete().eq('id',id); load(); }
load();
</script>
</body>
</html>
